<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEX-BOX MOVIE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    :root {
      --dark: #0F0F1A; --card: #1A1A2E; --accent: #E50914;
      --gold: #FFB800; --light: #E0E0E0; --gray: #444466;
    }
    body { background: var(--dark); color: var(--light); min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #222244; }
    .header h1 { font-size: 20px; color: white; }
    .search-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
    .search-bar { padding: 0 16px 12px; display: none; }
    .search-bar.active { display: block; }
    .search-input { width: 100%; background: var(--card); border: none; border-radius: 25px; padding: 12px 20px; color: white; font-size: 16px; outline: none; }
    .tabs { display: flex; overflow-x: auto; padding: 12px; gap: 8px; }
    .tab { padding: 6px 12px; background: transparent; border: none; color: #888; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab.active { color: white; border-bottom-color: var(--accent); }
    .featured { margin: 16px; border-radius: 12px; overflow: hidden; height: 220px; position: relative; cursor: pointer; }
    .featured-img { width: 100%; height: 100%; object-fit: cover; }
    .featured-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }
    .featured-tag { color: var(--gold); font-size: 12px; font-weight: bold; }
    .featured-title { font-size: 22px; font-weight: bold; color: white; margin: 4px 0; }
    .featured-desc { color: #ccc; font-size: 13px; margin-bottom: 10px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .watch-btn { background: var(--accent); border: none; color: white; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .section-title { font-size: 18px; font-weight: bold; padding: 8px 16px 12px; color: white; }
    .grid { display: flex; flex-wrap: wrap; padding: 0 12px; gap: 12px; }
    .card { width: calc(33.333% - 8px); border-radius: 8px; overflow: hidden; background: var(--card); cursor: pointer; position: relative; }
    .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
    .rating { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.7); border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: bold; display: flex; align-items: center; gap: 3px; }
    .rating-star { color: var(--gold); }
    .fav-mark { position: absolute; top: 6px; left: 6px; color: var(--gold); }
    .card-info { padding: 6px; }
    .movie-name { font-size: 12px; font-weight: 600; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-meta { font-size: 10px; color: #888; margin-top: 2px; }
    .empty { width: 100%; text-align: center; color: #888; padding: 40px; }
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: none; overflow-y: auto; z-index: 100; }
    .modal.active { display: block; }
    .modal-box { background: var(--card); margin-top: 50px; border-radius: 20px 20px 0 0; min-height: 90vh; }
    .modal-img-wrap { position: relative; }
    .modal-img { width: 100%; height: 250px; object-fit: cover; }
    .close-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; color: white; font-size: 32px; cursor: pointer; }
    .modal-body { padding: 20px; }
    .modal-title { font-size: 26px; font-weight: bold; color: white; margin-bottom: 10px; }
    .modal-meta { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; color: #ccc; }
    .genre-tag { background: var(--gray); padding: 4px 10px; border-radius: 15px; font-size: 12px; display: inline-block; margin: 8px 0 15px; }
    .modal-desc { color: #ddd; line-height: 1.6; margin-bottom: 20px; }
    .modal-buttons { display: flex; gap: 12px; margin-bottom: 25px; }
    .play-full { flex: 1; background: var(--accent); border: none; color: white; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .fav-btn { width: 50px; height: 50px; border: 1px solid #444; border-radius: 50%; background: transparent; color: #888; font-size: 20px; cursor: pointer; }
    .fav-btn.active { border-color: var(--gold); color: var(--gold); }
    .related-title { font-size: 16px; font-weight: bold; color: white; margin-bottom: 12px; }
    .related-row { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; }
    .related-poster { width: 80px; height: 120px; border-radius: 8px; object-fit: cover; flex-shrink: 0; cursor: pointer; }
  </style>
</head>
<body>
<div class="header">
  <h1>NEX-BOX MOVIE</h1>
  <button class="search-btn" id="searchToggle">🔍</button>
</div>
<div class="search-bar" id="searchBar">
  <input type="text" class="search-input" id="searchInput" placeholder="Search movies...">
</div>
<div class="tabs">
  <button class="tab active" data-tab="home">HOME</button>
  <button class="tab" data-tab="trending">TRENDING</button>
  <button class="tab" data-tab="movies">MOVIES</button>
  <button class="tab" data-tab="series">SERIES</button>
  <button class="tab" data-tab="favorites">FAVORITES</button>
</div>
<div class="featured" id="featuredCard">
  <img src="https://picsum.photos/id/1019/1200/600" class="featured-img" alt="Featured">
  <div class="featured-overlay">
    <div class="featured-tag">🔥 FEATURED</div>
    <h2 class="featured-title">Dark Horizon</h2>
    <p class="featured-desc">Astronauts on mission to save Earth from total destruction.</p>
    <button class="watch-btn">▶ WATCH NOW</button>
  </div>
</div>
<h3 class="section-title" id="sectionTitle">All Movies & Series</h3>
<div class="grid" id="movieGrid"></div>
<div class="modal" id="detailModal">
  <div class="modal-box">
    <div class="modal-img-wrap">
      <img src="" class="modal-img" id="modalBanner" alt="">
      <button class="close-btn" id="closeModal">&times;</button>
    </div>
    <div class="modal-body" id="modalContent"></div>
  </div>
</div>
<script>
const MOVIES = [
  { id:1, title:"Dark Horizon", year:2025, rating:8.7, duration:"2h 15m", genre:"Sci-Fi / Action", category:["trending","movies"], poster:"https://picsum.photos/id/1019/400/600", banner:"https://picsum.photos/id/1019/1200/600", description:"Astronauts on mission to save Earth from total destruction." },
  { id:2, title:"City of Shadows", year:2024, rating:9.1, duration:"8 Episodes", genre:"Crime / Drama", category:["trending","series"], poster:"https://picsum.photos/id/1035/400/600", banner:"https://picsum.photos/id/1035/1200/600", description:"Detectives uncover a deep conspiracy within the city government." },
  { id:3, title:"The Last Kingdom", year:2025, rating:8.3, duration:"2h 05m", genre:"Adventure / History", category:["movies"], poster:"https://picsum.photos/id/1036/400/600", banner:"https://picsum.photos/id/1036/1200/600", description:"An exiled warrior returns to reclaim his birthright and save his people." },
  { id:4, title:"Neon Nights", year:2024, rating:7.9, duration:"1h 52m", genre:"Thriller / Neo-Noir", category:["trending","movies"], poster:"https://picsum.photos/id/1039/400/600", banner:"https://picsum.photos/id/1039/1200/600", description:"A brilliant hacker uncovers a global surveillance network run by a powerful corporation." },
  { id:5, title:"Echoes of Tomorrow", year:2025, rating:8.5, duration:"10 Episodes", genre:"Sci-Fi / Mystery", category:["series"], poster:"https://picsum.photos/id/1047/400/600", banner:"https://picsum.photos/id/1047/1200/600", description:"People begin seeing visions of the future, changing everything they know." },
  { id:6, title:"Iron Legacy", year:2025, rating:8.2, duration:"2h 20m", genre:"Superhero / Action", category:["trending","movies"], poster:"https://picsum.photos/id/1092/400/600", banner:"https://picsum.photos/id/1092/1200/600", description:"The children of a legendary hero must protect the city when he falls." }
];
let activeTab = 'home', searchQuery = '', favorites = JSON.parse(localStorage.getItem('nexboxFavs') || '[]');
const tabNames = { home:'All Movies & Series', trending:'🔥 Trending Now', movies:'🎬 Movies', series:'📺 TV Series', favorites:'⭐ My Favorites' };
const tabs = document.querySelectorAll('.tab'), movieGrid = document.getElementById('movieGrid'), sectionTitle = document.getElementById('sectionTitle');
const searchToggle = document.getElementById('searchToggle'), searchBar = document.getElementById('searchBar'), searchInput = document.getElementById('searchInput');
const detailModal = document.getElementById('detailModal'), closeModal = document.getElementById('closeModal'), featuredCard = document.getElementById('featuredCard');
renderMovies();
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active')); tab.classList.add('active');
    activeTab = tab.dataset.tab; searchQuery = ''; searchInput.value = ''; renderMovies();
  });
});
searchToggle.addEventListener('click', () => {
  searchBar.classList.toggle('active');
  searchToggle.textContent = searchBar.classList.contains('active') ? '✕' : '🔍';
  if (searchBar.classList.contains('active')) searchInput.focus();
});
searchInput.addEventListener('input', e => { searchQuery = e.target.value.toLowerCase(); renderMovies(); });
featuredCard.addEventListener('click', () => openDetail(MOVIES[0]));
function renderMovies() {
  let filtered = MOVIES.filter(m => {
    const tabOk = activeTab === 'home' || m.category.includes(activeTab);
    const searchOk = !searchQuery || m.title.toLowerCase().includes(searchQuery) || m.genre.toLowerCase().includes(searchQuery);
    const favOk = activeTab !== 'favorites' || favorites.includes(m.id);
    return tabOk && searchOk && favOk;
  });
  featuredCard.style.display = (searchQuery || activeTab === 'favorites') ? 'none' : 'block';
  sectionTitle.textContent = searchQuery ? `Search: "${searchInput.value}"` : tabNames[activeTab];
  if (filtered.length === 0) { movieGrid.innerHTML = '<p class="empty">No movies found</p>'; return; }
  movieGrid.innerHTML = filtered.map(m => `
    <div class="card" data-id="${m.id}">
      <img src="${m.poster}" class="poster" alt="${m.title}">
      <div class="rating"><span class="rating-star">★</span> ${m.rating}</div>
      ${favorites.includes(m.id) ? '<span class="fav-mark">★</span>' : ''}
      <div class="card-info"><h4 class="movie-name">${m.title}</h4><p class="movie-meta">${m.year} • ${m.genre.split(' / ')[0]}</p></div>
    </div>
  `).join('');
  document.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => {
    const movie = MOVIES.find(m => m.id === parseInt(c.dataset.id));
    if (movie) openDetail(movie);
  }));
}
function openDetail(movie) {
  document.getElementById('modalBanner').src = movie.banner;
  const isFav = favorites.includes(movie.id);
  document.getElementById('modalContent').innerHTML = `
    <h2 class="modal-title">${movie.title}</h2>
    <div class="modal-meta"><span>★ ${movie.rating}</span><span>${movie.year}</span><span>${movie.duration}</span></div>
    <span class="genre-tag">${movie.genre}</span>
    <p class="modal-desc">${movie.description}</p>
    <div class="modal-buttons">
      <button class="play-full">▶ WATCH NOW</button>
      <button class="fav-btn ${isFav ? 'active' : ''}" id="favThis">${isFav ? '★' : '☆'}</button>
    </div>
    <h4 class="related-title">More Like This</h4>
    <div class="related-row">
      ${MOVIES.filter(m => m.id !== movie.id).slice(0,5).map(rel => `<img src="${rel.poster}" class="related-poster" data-id="${rel.id}" alt="${rel.title}">`).join('')}
    </div>
  `;
  detailModal.classList.add('active'); document.body.style.overflow = 'hidden';
  document.getElementById('favThis').addEventListener('click', () => {
    favorites.includes(movie.id) ? favorites = favorites.filter(f => f !== movie.id) : favorites.push(movie.id);
    localStorage.setItem('nexboxFavs', JSON.stringify(favorites)); openDetail(movie);
  });
  document.querySelectorAll('.related-poster').forEach(p => p.addEventListener('click', () => {
    const rel = MOVIES.find(m => m.id === parseInt(p.dataset.id));
    if (rel) openDetail(rel);
  }));
}
closeModal.addEventListener('click', () => {
  detailModal.classList.remove('active'); document.body.style.overflow = 'auto'; renderMovies();
});
</script>
</body>
</html>
